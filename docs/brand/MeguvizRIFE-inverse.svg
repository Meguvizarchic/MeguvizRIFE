<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 72 72" role="img" aria-labelledby="title desc"><title id="title">MeguvizRIFE</title><desc id="desc">保留已认可的三片S形流线：中央长珊瑚带与两侧短紫带。中央及短带的曲线连接改成精确C1连续，短带由同一母版生成并共同对齐端点高度；左右与中央均按180°关系保持均衡，最窄间隙约4.2，端部有意渐宽。</desc><g transform="translate(-2.76795 -2.76910) scale(1.21151)"><path fill="#FFF8F0" d="M24.909875071 18C22.909875071 23.8 22.309875071 28.4 21.909875071 33.9C21.509875071 39.4 19.709875071 41.8 10.509875071 46C12.509875071 40.2 13.109875071 35.6 13.509875071 30.1C13.909875071 24.6 15.709875071 22.2 24.909875071 18Z"/><path fill="#EF927A" d="M44.5 10C39.3 16.8 38 22.1 37.5 29.7C37 37.3 37.4 42 32.4 46.8C27.4 51.6 24.3 52.6 19.5 54C24.7 47.2 26 41.9 26.5 34.3C27 26.7 26.6 22 31.6 17.2C36.6 12.4 39.7 11.4 44.5 10Z"/><path fill="#FFF8F0" d="M39.090124929 46C41.090124929 40.2 41.690124929 35.6 42.090124929 30.1C42.490124929 24.6 44.290124929 22.2 53.490124929 18C51.490124929 23.8 50.890124929 28.4 50.490124929 33.9C50.090124929 39.4 48.290124929 41.8 39.090124929 46Z"/></g></svg>